name: Build vmlinux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential flex gawk git make pahole python3 rsync \
            cpio file clang llvm lld \
            libelf-dev libncurses-dev libssl-dev zlib1g-dev \
            liblz4-tool libzstd-dev

      - name: Clone vendor modules and devicetree
        run: |
          git clone --depth=1 https://github.com/DiskDVD/android_kernel_modules_and_devicetree_realme_sm6650.git /tmp/vendor-repo
          echo "Vendor repo cloned."
          ls -la /tmp/vendor-repo
          if [ -d /tmp/vendor-repo/kernel_platform ]; then
            cp -r /tmp/vendor-repo/kernel_platform/* .
          fi
          if [ -d /tmp/vendor-repo/vendor ]; then
            cp -r /tmp/vendor-repo/vendor/* .
          fi
          echo "Vendor repo merged into kernel tree."
          ls -la

      - name: Disable missing Kconfig references
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          source_re = re.compile(r'^(\s*)source\s+"([^"$]+)"\s*(?:#.*)?$')
          missing = []
          for name in tracked:
              if not name or os.path.basename(name) != "Kconfig":
                  continue
              if not os.path.isfile(name):
                  continue
              try:
                  with open(name, "r", encoding="utf-8") as f:
                      lines = f.readlines()
              except UnicodeDecodeError:
                  print(f"Skipping non-UTF8 file: {name}")
                  continue
              changed = False
              for index, line in enumerate(lines):
                  match = source_re.match(line.rstrip("\n"))
                  if not match:
                      continue
                  target = match.group(2)
                  if os.path.exists(target):
                      continue
                  missing.append(f"{name}:{index + 1} -> {target}")
                  lines[index] = (
                      match.group(1)
                      + "# Disabled for analysis build: missing Kconfig: "
                      + target
                      + "\n"
                  )
                  changed = True
              if changed:
                  try:
                      with open(name, "w", encoding="utf-8") as f:
                          f.writelines(lines)
                  except UnicodeEncodeError:
                      print(f"Cannot write non-UTF8 file: {name}")
          if missing:
              print("Disabled absent Kconfig references:")
              for entry in missing:
                  print(f"  {entry}")
          else:
              print("No missing Kconfig references found.")
          PY

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 LLVM=1 gki_defconfig

      - name: Enable debug info
        run: |
          scripts/config --file out/.config \
            -e DEBUG_INFO \
            -e DEBUG_INFO_DWARF4 \
            -d DEBUG_INFO_DWARF5
          make O=out ARCH=arm64 LLVM=1 olddefconfig

      - name: Build vmlinux
        run: |
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" vmlinux
          test -s out/vmlinux

      - name: Verify
        run: |
          file out/vmlinux
          ls -lh out/vmlinux out/System.map

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-main
          path: |
            out/vmlinux
            out/System.map
            out/.config
          if-no-files-found: error
          retention-days: 14

      - name: Upload config on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-build-debug
          path: |
            out/.config
            out/include/config/auto.conf
          if-no-files-found: ignore
          retention-days: 7
